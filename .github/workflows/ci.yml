name: CI

on:
  push:
    branches: [main]
  # Every base branch: PRs are stacked onto feature branches.
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install plugin dependencies
        run: npm run install:plugins

      - name: Lint lockfiles
        run: |
          set -euo pipefail
          mapfile -t lockfiles < <(git ls-files -- 'package-lock.json' '**/package-lock.json')
          for lockfile in "${lockfiles[@]}"; do
            echo "Linting $lockfile"
            npx --yes lockfile-lint --path "$lockfile" --type npm --allowed-hosts npm --validate-https --validate-integrity
          done

      - name: Verify dependency signatures
        run: |
          set -euo pipefail
          npm audit signatures
          for plugin in $(node scripts/plugins.mjs list); do
            echo "Verifying $plugin"
            (cd "$plugin" && npm audit signatures)
          done

      - name: Validate CI scripts
        run: npm run test:scripts

      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install plugin dependencies
        run: npm run install:plugins

      - name: Typecheck all plugins
        run: npm run typecheck

      # Ubuntu only: the PNGs come from sharp's prebuilt libvips, and byte-identical output is
      # only verified on linux-x64.
      - name: Verify generated icons
        run: |
          npm run generate:icons --prefix file-explorer
          git diff --exit-code -- file-explorer/client/file-icons.generated.ts

      # The prebuilt client (see file-explorer/scripts/build-client.mjs) must match its source.
      - name: Verify prebuilt client
        run: |
          npm run build:client
          git diff --exit-code -- file-explorer/client/dist

  hermes-smoke:
    name: hermes-smoke
    runs-on: ubuntu-latest
    env:
      # v0.13.0 is older than the Hermes in the Paseo app. See scripts/hermes-smoke/run.mjs.
      HERMES_VERSION: v0.13.0
      HERMES_CLI_LINUX_SHA256: aead6eb0b8f563bb022354352eae32dad96c933330b6c1941b6db17674ca68ae
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install plugin dependencies
        run: npm run install:plugins

      - name: Install Hermes CLI
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/hermes"
          mkdir -p "$dir"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$dir/hermes-cli-linux.tar.gz" \
            "https://github.com/facebook/hermes/releases/download/${HERMES_VERSION}/hermes-cli-linux.tar.gz"
          echo "${HERMES_CLI_LINUX_SHA256}  $dir/hermes-cli-linux.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/hermes-cli-linux.tar.gz" -C "$dir" ./hermes
          echo "HERMES_BIN=$dir/hermes" >> "$GITHUB_ENV"

      - name: Run Hermes smoke test
        run: npm run test:hermes

  plugin-tests-ubuntu:
    name: plugin-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps: &plugin_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install plugin dependencies
        run: npm run install:plugins

      - name: Run plugin tests
        run: npm run test

  plugin-tests-windows:
    name: plugin-tests (windows-latest)
    runs-on: windows-latest
    steps: *plugin_test_steps

  plugin-tests-macos:
    name: plugin-tests (macos-latest)
    runs-on: macos-latest
    steps: *plugin_test_steps
